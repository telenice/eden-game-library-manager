# Home side: ./wireguard/wg_confs/wg0.conf for the linuxserver/wireguard container.
# Your home server dials out to the VPS, so no port forward is needed on your router.

[Interface]
PrivateKey = <HOME_PRIVATE_KEY>
Address = 10.13.13.2/32

[Peer]
PublicKey = <VPS_PUBLIC_KEY>
Endpoint = <VPS_PUBLIC_IP>:51820
# Only the VPS is reachable through the tunnel; nothing else from this network is routed to it.
AllowedIPs = 10.13.13.1/32
# Keeps the connection open through your router so the VPS can reach AeroFoil at any time.
PersistentKeepalive = 25
