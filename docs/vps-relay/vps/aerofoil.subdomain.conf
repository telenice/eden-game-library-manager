## Copy to ./swag/nginx/proxy-confs/aerofoil.subdomain.conf on the VPS.
## Only the Eden Game Library Manager endpoints are forwarded to the home AeroFoil over WireGuard.

# Only the Eden Game Library Manager app (User-Agent "EdenGameLibraryManager/<version>").
# Remove this map and the "if" below to also allow other clients.
map $http_user_agent $egl_allowed_client {
    default                         0;
    "~^EdenGameLibraryManager/"     1;
}

server {
    listen 443 ssl;
    http2 on;

    server_name aerofoil.*;

    include /config/nginx/ssl.conf;

    # The app only sends GET requests without a body.
    client_max_body_size 1k;

    if ($egl_allowed_client = 0) {
        return 403;
    }

    # Everything not listed below (web UI, admin API, uploads, ...) is refused.
    location / {
        return 403;
    }

    # The only endpoints the app uses. The regex is quoted because of the {16} quantifiers.
    location ~ "^/api/(remote/sections|shop/sections|get_game/[0-9]+|shop/icon/[0-9A-Fa-f]{16}|shop/title-info/[0-9A-Fa-f]{16}|shop/screenshot/[0-9A-Fa-f]{16}/[0-9]+)$" {
        limit_except GET {
            deny all;
        }

        # Home AeroFoil, reached through the WireGuard tunnel (plain HTTP is fine inside it).
        proxy_pass http://10.13.13.2:8465;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Clients connect directly (DNS only), so overwrite any X-Forwarded-For they send.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Ssl on;
    }
}
