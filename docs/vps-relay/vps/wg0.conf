# /etc/wireguard/wg0.conf on the Oracle VPS.
# The VPS waits for your home server to connect; it never needs to reach your home router directly.

[Interface]
Address = 10.13.13.1/24
ListenPort = 51820
PrivateKey = <VPS_PRIVATE_KEY>

# Home server (the only peer). It can only use the tunnel address 10.13.13.2.
[Peer]
PublicKey = <HOME_PUBLIC_KEY>
AllowedIPs = 10.13.13.2/32
